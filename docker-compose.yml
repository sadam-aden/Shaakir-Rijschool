# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rijschool
      POSTGRES_PASSWORD: rijschool
      POSTGRES_DB: rijschool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
